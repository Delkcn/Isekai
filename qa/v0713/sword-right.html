<!doctype html><meta charset='utf-8'><title>0.7.11 · 0.7.5 动作 · 最高点停顿 0.1 秒显剑</title><style>body{background:#2d323e;color:white;font:17px system-ui;text-align:center}canvas{height:77vh}button,input,select{margin:8px}</style><p>0.7.11 · 右向 · 预备 / 起剑 / 斩击 / 收势 / 复位</p><button id='toggle'>暂停 / 播放</button><select id='mode'><option value='0'>无特效</option><option value='2'>骨骼与握持锚点</option><option value='1'>星芒与斩击轨迹</option></select><select id='speed'><option value='1'>正常速度</option><option value='.25'>四分之一速度</option></select><input id='seek' type='range' min='0' max='68' value='0'><span id='stamp'></span><br><canvas id='v' width='420' height='500'></canvas><script>const images=['-clean','','-bones'].map(s=>{let im=new Image();im.src='sword-right'+s+'.png';return im}),ctx=v.getContext('2d');let f=0,last=0,play=true;toggle.onclick=()=>play=!play;seek.oninput=()=>{play=false;f=+seek.value};function tick(t){if(last&&play)f=(f+(t-last)*.06*+speed.value)%69;last=t;let n=Math.floor(f),im=images[+mode.value];if(im.complete&&im.naturalWidth)ctx.drawImage(im,n%9*420,Math.floor(n/9)*500,420,500,0,0,420,500);seek.value=n;stamp.textContent=Math.min(1.13,n/60).toFixed(2)+'s';requestAnimationFrame(tick)}requestAnimationFrame(tick);</script>

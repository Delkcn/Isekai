<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ヰ世界情緒 · 2.5D 动作检查</title>
<style>body{background:#ece8e2;color:#302e2a;font:16px system-ui;margin:0}main{max-width:920px;margin:32px auto;padding:24px}h1{font-size:26px}canvas{display:block;margin:20px auto;background:#d5d2cd;width:344px;height:418px;border-radius:12px}button,select{font:inherit;padding:8px;margin:5px}input{width:100%}p{line-height:1.7}.note{background:#fff4d6;padding:12px 18px;border-radius:8px}</style>
<main><h1>ヰ世界情緒 · 0.6.3 试验版</h1><p>预览使用 Windows C# 渲染器导出的图片。可慢放、暂停和逐张查看，不使用浏览器重新模拟骨骼变形。</p><p class="note">左右端点复用行走渲染器。中间的方向材质切换仍可见；这是 2.5D 骨骼试验，尚非无缝的完整 3D 转身。</p>
<select id="mode"><option value="turn">转身实际渲染采样</option><option value="rest">休息关键姿态</option></select><select id="speed"><option value="1">正常</option><option value="0.25">¼ 速度</option></select><button id="toggle">暂停</button><button id="prev">上一张</button><button id="next">下一张</button><button id="bg">深色背景</button><canvas id="view" width="287" height="348"></canvas><input id="position" type="range" min="0" max="80" value="0"><p id="status"></p></main>
<script>
const PACKED=/*FRAME_DATA*/;
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),slider=document.getElementById('position'),status=document.getElementById('status');let images={},mode='turn',playing=true,index=0,clock=0,last=0,dark=false;
function draw(){ctx.clearRect(0,0,287,348);ctx.drawImage(images[mode][index],0,0);slider.value=index;status.textContent=`${index+1} / ${images[mode].length} · ${mode==='turn'?'归一化转向 '+(-1+index/40).toFixed(3):'休息关键姿态（不是动作时间轴）'}`;}
Promise.all(Object.entries(PACKED).map(async([name,keys])=>{images[name]=await Promise.all(keys.map(k=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=k.image;})));})).then(()=>{draw();requestAnimationFrame(tick);});
function tick(t){const dt=last?(t-last)/1000:0;last=t;if(playing){clock+=dt*Number(document.getElementById('speed').value);const p=(clock%4)/4;index=Math.round((p<.5?p*2:2-p*2)*(images[mode].length-1));draw();}requestAnimationFrame(tick);}
function pause(){playing=false;document.getElementById('toggle').textContent='播放';}
slider.oninput=()=>{pause();index=+slider.value;draw();};document.getElementById('mode').onchange=e=>{mode=e.target.value;index=0;clock=0;slider.max=images[mode].length-1;draw();};document.getElementById('toggle').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停':'播放';clock=index/(images[mode].length-1)*2;};document.getElementById('prev').onclick=()=>{pause();index=Math.max(0,index-1);draw();};document.getElementById('next').onclick=()=>{pause();index=Math.min(images[mode].length-1,index+1);draw();};document.getElementById('bg').onclick=e=>{dark=!dark;canvas.style.background=dark?'#292b32':'#d5d2cd';e.target.textContent=dark?'浅色背景':'深色背景';};
</script></html>
